<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SO Pintar</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        textarea { resize: vertical; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button.sync { background-color: #007bff; }
        button.kamera { background-color: #17a2b8; margin-top: 0; width: 35%; }
        button.tutup-kamera { background-color: #dc3545; display: none; }
        .hidden { display: none; }
        .status-box { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-size: 0.9em; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        #reader { width: 100%; margin-top: 10px; display: none; }
        .ruang-ganti { border-left: 4px solid #ffc107; padding-left: 10px; margin-top: 15px; background: #fffdf5; padding-bottom: 10px; }
        /* Tambahan CSS: Papar huruf besar terus semasa menaip (Visual Sahaja) */
        input[type="text"], textarea { text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pemantauan SO</h2>
    
    <label>Lokaliti:</label>
    <input list="senarai-lokaliti" id="lokaliti" placeholder="PILIH ATAU TAIP BAHARU..." required>
    <datalist id="senarai-lokaliti">
        <option value="KG SETIA">
        <option value="TAMAN MAJU">
        <option value="DESA AMAN">
    </datalist>

    <label>Tindakan:</label>
    <select id="tindakan" onchange="urusTindakan()">
        <option value="">-- Pilih Tindakan --</option>
        <option value="Pasang">Pasang (R1/Bekas Baharu)</option>
        <option value="Kutip">Kutip & Ganti</option>
    </select>

    <label id="label_id_utama">ID Bekas:</label>
    <div class="flex-row">
        <input type="text" id="id_bekas" placeholder="SO-001" style="width: 65%;" required>
        <button type="button" class="kamera" onclick="mulaImbas('id_bekas')">📷 QR</button>
    </div>

    <div id="ruangKutip" class="hidden ruang-ganti">
        <label>Status Bekas Lama:</label>
        <select id="status" onchange="urusStatus()">
            <option value="N/A">-- Pilih Status --</option>
            <option value="BAIK">BAIK</option>
            <option value="MUSNAH">MUSNAH</option>
            <option value="HILANG">HILANG</option>
        </select>

        <div id="divGanti" class="hidden">
            <label>Ganti Bekas Baharu?</label>
            <select id="ganti_bekas" onchange="urusGanti()">
                <option value="TIDAK">TIDAK</option>
                <option value="YA">YA (Letak Bekas Baharu)</option>
            </select>
        </div>

        <div id="divBekasBaharu" class="hidden">
            <label style="color: #d32f2f;">ID Bekas BAHARU:</label>
            <div class="flex-row">
                <input type="text" id="id_bekas_baharu" placeholder="SO-002" style="width: 65%;">
                <button type="button" class="kamera" onclick="mulaImbas('id_bekas_baharu')">📷 QR</button>
            </div>
        </div>
    </div>
    
    <div id="reader"></div>
    <button type="button" id="btnTutupKamera" class="tutup-kamera" onclick="hentiImbas()">Tutup Kamera</button>

    <label>Catatan (Deskripsi Lokasi):</label>
    <textarea id="catatan" rows="2" placeholder="CONTOH: BEKAS PECAH..."></textarea>

    <button onclick="simpanData()">Simpan (Luar Talian)</button>
    <button class="sync" onclick="syncData()">Sync ke Server ☁️</button>

    <div class="status-box">
        <strong>Status GPS:</strong> <span id="gps_status">Menunggu...</span><br>
        <strong>Rekod Belum Sync:</strong> <span id="rekod_count">0</span>
    </div>
</div>

<script>
    let latSemasa = "";
    let lngSemasa = "";
    let html5QrCode;
    let sasaranQR = ""; 

    function urusTindakan() {
        var tindakan = document.getElementById("tindakan").value;
        var ruangKutip = document.getElementById("ruangKutip");
        var labelId = document.getElementById("label_id_utama");

        if (tindakan === "Kutip") {
            ruangKutip.classList.remove("hidden");
            labelId.innerText = "ID Bekas LAMA:";
        } else {
            ruangKutip.classList.add("hidden");
            labelId.innerText = "ID Bekas:";
            document.getElementById("status").value = "N/A";
            document.getElementById("ganti_bekas").value = "TIDAK";
            document.getElementById("divGanti").classList.add("hidden");
            document.getElementById("divBekasBaharu").classList.add("hidden");
        }
    }

    function urusStatus() {
        var status = document.getElementById("status").value;
        if (status !== "N/A") {
            document.getElementById("divGanti").classList.remove("hidden");
            document.getElementById("ganti_bekas").value = "YA"; 
            urusGanti(); 
        }
    }

    function urusGanti() {
        var ganti = document.getElementById("ganti_bekas").value;
        var status = document.getElementById("status").value;
        var divBaharu = document.getElementById("divBekasBaharu");

        if (ganti === "YA") {
            divBaharu.classList.remove("hidden");
            if (status === "MUSNAH" || status === "HILANG") {
                alert("⚠️ AMARAN: Spot ini tidak selamat (Kes Hilang/Musnah). Sila letak bekas baharu di spot lain dan sistem akan menarik koordinat GPS yang baharu.");
                dapatkanGPS(); 
            }
        } else {
            divBaharu.classList.add("hidden");
        }
    }

    function dapatkanGPS() {
        if (navigator.geolocation) {
            document.getElementById("gps_status").innerText = "Mencari lokasi...";
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    latSemasa = position.coords.latitude;
                    lngSemasa = position.coords.longitude;
                    document.getElementById("gps_status").innerText = "✅ Berjaya didapati (" + latSemasa.toFixed(5) + ")";
                },
                function(error) {
                    document.getElementById("gps_status").innerText = "❌ Sila benarkan GPS telefon";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }
    window.onload = dapatkanGPS;

    function mulaImbas(targetInput) {
        sasaranQR = targetInput; 
        document.getElementById('reader').style.display = "block";
        document.getElementById('btnTutupKamera').style.display = "block";
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText, decodedResult) => {
                document.getElementById(sasaranQR).value = decodedText;
                hentiImbas();
                if (navigator.vibrate) navigator.vibrate(200);
            },
            (errorMessage) => {}
        ).catch((err) => alert("Ralat kamera: " + err));
    }

    function hentiImbas() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = "none";
                document.getElementById('btnTutupKamera').style.display = "none";
            }).catch(err => console.log(err));
        }
    }

    function simpanData() {
        if (!latSemasa || !lngSemasa) {
            alert("Sila tunggu koordinat GPS didapati terlebih dahulu.");
            return;
        }

        // Ambil data asal dari borang
        let tindakan_asal = document.getElementById("tindakan").value;
        let ganti = document.getElementById("ganti_bekas").value;
        let id_bekas_asal = document.getElementById("id_bekas").value;
        let lokaliti_asal = document.getElementById("lokaliti").value;

        if (!lokaliti_asal || !tindakan_asal || !id_bekas_asal) {
            alert("Sila lengkapkan borang utama.");
            return;
        }

        // KOD BAHARU: Tukar SEMUA pembolehubah menjadi HURUF BESAR
        let lokaliti = lokaliti_asal.toUpperCase();
        let tindakan = tindakan_asal.toUpperCase();
        let status = document.getElementById("status").value.toUpperCase();
        let id_bekas = id_bekas_asal.toUpperCase();
        let id_baharu = document.getElementById("id_bekas_baharu").value.toUpperCase();
        let CATATAN = document.getElementById("catatan").value.toUpperCase(); 
        
        let tarikh = new Date().toLocaleDateString('en-GB');
        let masa = new Date().toLocaleTimeString('en-US', { hour12: false });

        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];

        // Hantar data yang telah di'besarkan' ke memori
        if (tindakan_asal === "Pasang") {
            senaraiRekod.push({ lokaliti, tarikh, masa, id_bekas, tindakan, status: "N/A", latitud: latSemasa, longitud: lngSemasa, CATATAN });
        } 
        else if (tindakan_asal === "Kutip") {
            senaraiRekod.push({ lokaliti, tarikh, masa, id_bekas, tindakan, status, latitud: latSemasa, longitud: lngSemasa, CATATAN });
            
            if (ganti === "YA") {
                if (!id_baharu) { alert("Sila masukkan ID Bekas Baharu."); return; }
                senaraiRekod.push({ lokaliti, tarikh, masa, id_bekas: id_baharu, tindakan: "PASANG", status: "N/A", latitud: latSemasa, longitud: lngSemasa, CATATAN });
            }
        }

        localStorage.setItem("dataSO", JSON.stringify(senaraiRekod));
        alert("Data berjaya disimpan!");
        
        document.getElementById("id_bekas").value = ""; 
        document.getElementById("id_bekas_baharu").value = "";
        document.getElementById("catatan").value = ""; 
        if(tindakan_asal === "Kutip") { urusTindakan(); }
        kiraRekod();
    }

    function kiraRekod() {
        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];
        document.getElementById("rekod_count").innerText = senaraiRekod.length;
    }
    kiraRekod();

    function syncData() {
        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];
        if (senaraiRekod.length === 0) { alert("Tiada data baharu untuk di-sync."); return; }

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4x6ZtUiUyfI9yYAEFQwbgmPyFS5HCRFcH8xNMPlmF_MmKIo5KytBIZo-atUPIos2U/exec"; 
        document.querySelector(".sync").innerText = "Sedang Sync (Mohon Tunggu)...";

        let promises = senaraiRekod.map(rekod => 
            fetch(WEB_APP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(rekod),
            }).then(response => response.json())
        );

        Promise.all(promises)
            .then(results => {
                localStorage.setItem("dataSO", JSON.stringify([]));
                kiraRekod();
                document.querySelector(".sync").innerText = "Sync ke Server ☁️";
                alert("Semua data berjaya masuk ke Google Sheets!");
            })
            .catch(error => {
                console.error('Error:', error);
                document.querySelector(".sync").innerText = "Sync ke Server ☁️";
                alert("Ralat! Pastikan internet anda stabil.");
            });
    }
</script>

</body>
</html>
