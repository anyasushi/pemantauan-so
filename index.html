<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SO Pintar</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        textarea { resize: vertical; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button.sync { background-color: #007bff; }
        button.kamera { background-color: #17a2b8; margin-top: 0; width: 35%; }
        button.tutup-kamera { background-color: #dc3545; display: none; }
        button.btn-refresh { background-color: #6c757d; color: white; border: none; padding: 5px 10px; margin-top: 0; width: auto; font-size: 0.8em; border-radius: 5px; cursor: pointer; }
        .hidden { display: none; }
        .status-box { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-size: 0.9em; }
        .flex-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        #reader { width: 100%; margin-top: 10px; display: none; }
        .ruang-ganti { border-left: 4px solid #ffc107; padding-left: 10px; margin-top: 15px; background: #fffdf5; padding-bottom: 10px; }
        input[type="text"], textarea { text-transform: uppercase; }
        .teks-amaran { color: red; font-size: 0.85em; font-weight: bold; display: none; margin-top: 2px; }
        .teks-info { color: #007bff; font-size: 0.85em; font-weight: bold; display: block; margin-top: 5px; }
        .mod-pukal-box { margin-top: 15px; background: #e3f2fd; padding: 10px; border-radius: 5px; border: 1px solid #90caf9; }
        .ruang-premis { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; border-left: 3px solid #17a2b8; }
        .ruang-premis label { font-size: 0.9em; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pemantauan SO</h2>
    
    <label>Lokaliti:</label>
    <input list="senarai-lokaliti" id="lokaliti" placeholder="PILIH ATAU TAIP BAHARU..." oninput="janaSenaraiID()" required>
    <datalist id="senarai-lokaliti">
        <option value="KG SETIA">
        <option value="TAMAN MAJU">
        <option value="DESA AMAN">
    </datalist>

    <label>Jenis Kediaman:</label>
    <select id="jenis_premis" onchange="urusJenisPremis()">
        <option value="">-- PILIH JENIS --</option>
        <option value="STRATA">STRATA (BERTINGKAT)</option>
        <option value="LANDED">LANDED (ATAS TANAH)</option>
    </select>

    <div id="ruang_strata" class="hidden ruang-premis" style="border-left-color: #007bff;">
        <label>Blok:</label>
        <input type="text" id="strata_blok" placeholder="CONTOH: A">
        <label>Tingkat:</label>
        <input type="text" id="strata_tingkat" placeholder="CONTOH: 3">
    </div>

    <div id="ruang_landed" class="hidden ruang-premis" style="border-left-color: #28a745;">
        <label>Jalan:</label>
        <input type="text" id="landed_jalan" placeholder="CONTOH: JALAN KASTURI 1">
    </div>

    <label>Jumlah Bekas (Lokaliti Ini):</label>
    <select id="jumlah_bekas" onchange="urusJumlahBekas()">
        <option value="">-- PILIH JUMLAH --</option>
        <option value="150">150</option>
        <option value="300">300</option>
        <option value="600">600</option>
        <option value="CUSTOM">CUSTOM (MASUKKAN JUMLAH)</option>
    </select>
    <input type="number" id="jumlah_custom" class="hidden" placeholder="Masukkan jumlah (Contoh: 50)" oninput="janaSenaraiID()">

    <label>Tindakan:</label>
    <select id="tindakan" onchange="urusTindakan()">
        <option value="">-- Pilih Tindakan --</option>
        <option value="Pasang">Pasang (R1/Bekas Baharu)</option>
        <option value="Kutip">Kutip & Ganti</option>
    </select>

    <div class="mod-pukal-box">
        <label style="margin-top:0; cursor:pointer;">
            <input type="checkbox" id="mod_pukal" onchange="urusPukal()"> ⚡ Mod Pukal (Range di Point Sama)
        </label>
    </div>

    <label id="label_id_utama">ID Bekas:</label>
    <div class="flex-row">
        <select id="id_bekas" style="width: 65%;" onchange="semakID(this, 'amaran_id_utama')" required>
            <option value="">-- PILIH ID --</option>
        </select>
        <button type="button" class="kamera" onclick="mulaImbas('id_bekas')">📷 QR</button>
    </div>
    <span id="amaran_id_utama" class="teks-amaran">⚠️ ID ini telah diisi di lokaliti ini!</span>

    <div id="ruang_pukal_akhir" class="hidden">
        <label style="color:#0056b3;">ID Bekas (AKHIR):</label>
        <div class="flex-row">
            <select id="id_bekas_akhir" style="width: 65%;">
                <option value="">-- PILIH ID --</option>
            </select>
            <button type="button" class="kamera" onclick="mulaImbas('id_bekas_akhir')">📷 QR</button>
        </div>
    </div>

    <span id="label_last_id" class="teks-info">Rekod Terakhir: Tiada</span>

    <div id="ruangKutip" class="hidden ruang-ganti">
        <label>Status Bekas Lama:</label>
        <select id="status" onchange="urusStatus()">
            <option value="N/A">-- Pilih Status --</option>
            <option value="BAIK">BAIK</option>
            <option value="MUSNAH">MUSNAH</option>
            <option value="HILANG">HILANG</option>
        </select>

        <div id="divGanti" class="hidden">
            <label>Ganti Bekas Baharu?</label>
            <select id="ganti_bekas" onchange="urusGanti()">
                <option value="TIDAK">TIDAK</option>
                <option value="YA">YA (Letak Bekas Baharu)</option>
            </select>
        </div>

        <div id="divBekasBaharu" class="hidden">
            <label id="label_id_baharu" style="color: #d32f2f;">ID Bekas BAHARU:</label>
            <div class="flex-row">
                <select id="id_bekas_baharu" style="width: 65%;" onchange="semakID(this, 'amaran_id_baharu')">
                    <option value="">-- PILIH ID --</option>
                </select>
                <button type="button" class="kamera" onclick="mulaImbas('id_bekas_baharu')">📷 QR</button>
            </div>
            <span id="amaran_id_baharu" class="teks-amaran">⚠️ ID ini telah diisi di lokaliti ini!</span>
        </div>
    </div>
    
    <div id="reader"></div>
    <button type="button" id="btnTutupKamera" class="tutup-kamera" onclick="hentiImbas()">Tutup Kamera</button>

    <label>Catatan (Deskripsi Lokasi):</label>
    <textarea id="catatan" rows="2" placeholder="CONTOH: TEPI PAGAR..."></textarea>

    <button onclick="simpanData()">Simpan (Luar Talian)</button>
    <button class="sync" onclick="syncData()">Sync ke Server ☁️</button>

    <div class="status-box">
        <div class="flex-row" style="margin-bottom: 5px;">
            <div><strong>Status GPS:</strong> <span id="gps_status">Menunggu...</span></div>
            <button type="button" class="btn-refresh" onclick="dapatkanGPS()">🔄 Refresh</button>
        </div>
        <strong>Rekod Belum Sync:</strong> <span id="rekod_count">0</span>
    </div>
</div>

<script>
    let latSemasa = "";
    let lngSemasa = "";
    let html5QrCode;
    let sasaranQR = ""; 
    let sejarahID = JSON.parse(localStorage.getItem("sejarahID_V2")) || {}; 

    function urusJenisPremis() {
        let jenis = document.getElementById("jenis_premis").value;
        let divStrata = document.getElementById("ruang_strata");
        let divLanded = document.getElementById("ruang_landed");
        
        if (jenis === "STRATA") {
            divStrata.classList.remove("hidden");
            divLanded.classList.add("hidden");
        } else if (jenis === "LANDED") {
            divLanded.classList.remove("hidden");
            divStrata.classList.add("hidden");
        } else {
            divStrata.classList.add("hidden");
            divLanded.classList.add("hidden");
        }
    }

    function dapatkanSejarahLokaliti() {
        let lokaliti = document.getElementById("lokaliti").value.toUpperCase();
        if (!lokaliti) return [];
        return sejarahID[lokaliti] || [];
    }

    function urusJumlahBekas() {
        var val = document.getElementById("jumlah_bekas").value;
        var customInput = document.getElementById("jumlah_custom");
        if (val === "CUSTOM") { customInput.classList.remove("hidden"); } 
        else { customInput.classList.add("hidden"); customInput.value = ""; }
        janaSenaraiID();
    }

    function janaSenaraiID() {
        var val = document.getElementById("jumlah_bekas").value;
        var limit = (val === "CUSTOM") ? (parseInt(document.getElementById("jumlah_custom").value) || 0) : (parseInt(val) || 0);
        
        let selectID = document.getElementById("id_bekas");
        let selectAkhir = document.getElementById("id_bekas_akhir");
        let selectBaharu = document.getElementById("id_bekas_baharu");
        
        let htmlOptions = '<option value="">-- PILIH ID --</option>';
        let sejarahSemasa = dapatkanSejarahLokaliti(); 

        for (var i = 1; i <= limit; i++) {
            var namaID = "SO-" + i.toString().padStart(3, '0');
            if (sejarahSemasa.includes(namaID)) {
                htmlOptions += `<option value="${namaID}" disabled>${namaID} [SELESAI]</option>`;
            } else {
                htmlOptions += `<option value="${namaID}">${namaID}</option>`;
            }
        }
        
        let currentID = selectID.value;
        selectID.innerHTML = htmlOptions;
        selectAkhir.innerHTML = htmlOptions;
        selectBaharu.innerHTML = htmlOptions;
        if(currentID) selectID.value = currentID;
    }

    function urusPukal() {
        let isPukal = document.getElementById("mod_pukal").checked;
        if (isPukal) {
            document.getElementById("label_id_utama").innerText = "ID Bekas (MULA):";
            document.getElementById("ruang_pukal_akhir").classList.remove("hidden");
            document.getElementById("label_id_baharu").innerText = "ID Bekas BAHARU (MULA):";
        } else {
            document.getElementById("label_id_utama").innerText = "ID Bekas:";
            document.getElementById("ruang_pukal_akhir").classList.add("hidden");
            document.getElementById("label_id_baharu").innerText = "ID Bekas BAHARU:";
        }
    }

    function semakID(elemenInput, idAmaran) {
        var amaran = document.getElementById(idAmaran);
        let sejarahSemasa = dapatkanSejarahLokaliti();
        if (sejarahSemasa.includes(elemenInput.value.toUpperCase())) amaran.style.display = "block";
        else amaran.style.display = "none";
    }

    function urusTindakan() {
        var tindakan = document.getElementById("tindakan").value;
        var ruangKutip = document.getElementById("ruangKutip");
        if (tindakan === "Kutip") { ruangKutip.classList.remove("hidden"); } 
        else {
            ruangKutip.classList.add("hidden");
            document.getElementById("status").value = "N/A";
            document.getElementById("ganti_bekas").value = "TIDAK";
            document.getElementById("divGanti").classList.add("hidden");
            document.getElementById("divBekasBaharu").classList.add("hidden");
        }
    }

    function urusStatus() {
        if (document.getElementById("status").value !== "N/A") {
            document.getElementById("divGanti").classList.remove("hidden");
            document.getElementById("ganti_bekas").value = "YA"; 
            urusGanti(); 
        }
    }

    function urusGanti() {
        var ganti = document.getElementById("ganti_bekas").value;
        var status = document.getElementById("status").value;
        var divBaharu = document.getElementById("divBekasBaharu");
        if (ganti === "YA") {
            divBaharu.classList.remove("hidden");
            if (status === "MUSNAH" || status === "HILANG") {
                alert("⚠️ AMARAN: Spot ini tidak selamat. Sila letak bekas baharu di spot lain (Sila Refresh GPS secara manual jika beralih lokasi).");
            }
        } else { divBaharu.classList.add("hidden"); }
    }

    function dapatkanGPS() {
        if (navigator.geolocation) {
            document.getElementById("gps_status").innerText = "Mencari koordinat baharu...";
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    latSemasa = position.coords.latitude;
                    lngSemasa = position.coords.longitude;
                    document.getElementById("gps_status").innerText = "✅ Berjaya (" + latSemasa.toFixed(5) + ")";
                },
                function(error) { document.getElementById("gps_status").innerText = "❌ Sila benarkan GPS telefon"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }
    window.onload = function() { dapatkanGPS(); janaSenaraiID(); };

    function mulaImbas(targetInput) {
        sasaranQR = targetInput; 
        document.getElementById('reader').style.display = "block";
        document.getElementById('btnTutupKamera').style.display = "block";
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                var inputTarget = document.getElementById(sasaranQR);
                let optionExists = Array.from(inputTarget.options).some(opt => opt.value === decodedText);
                if (!optionExists) {
                    let newOpt = document.createElement("option");
                    newOpt.value = decodedText;
                    newOpt.text = decodedText;
                    inputTarget.appendChild(newOpt);
                }
                inputTarget.value = decodedText;
                if(sasaranQR === "id_bekas") semakID(document.getElementById(sasaranQR), "amaran_id_utama");
                if(sasaranQR === "id_bekas_baharu") semakID(document.getElementById(sasaranQR), "amaran_id_baharu");
                hentiImbas();
                if (navigator.vibrate) navigator.vibrate(200);
            }, (err) => {}
        ).catch((err) => alert("Ralat kamera: " + err));
    }

    function hentiImbas() {
        if (html5QrCode) html5QrCode.stop().then(() => {
            document.getElementById('reader').style.display = "none";
            document.getElementById('btnTutupKamera').style.display = "none";
        }).catch(err => console.log(err));
    }

    function ekstrakID(idStr) {
        let match = idStr.match(/^([^0-9]*)([0-9]+)$/);
        if (!match) return null;
        return { prefix: match[1], num: parseInt(match[2]), padLength: match[2].length };
    }

    function simpanData() {
        if (!latSemasa || !lngSemasa) { alert("Sila tunggu koordinat GPS didapati terlebih dahulu."); return; }

        let tindakan_asal = document.getElementById("tindakan").value;
        let ganti = document.getElementById("ganti_bekas").value;
        let lokaliti_asal = document.getElementById("lokaliti").value;
        let id_mula = document.getElementById("id_bekas").value.toUpperCase();
        let isPukal = document.getElementById("mod_pukal").checked;

        if (!lokaliti_asal || !tindakan_asal || !id_mula) { alert("Sila lengkapkan borang utama."); return; }

        let lokaliti = lokaliti_asal.toUpperCase();
        let senaraiID = [];
        
        if (isPukal) {
            let id_akhir = document.getElementById("id_bekas_akhir").value.toUpperCase();
            if(!id_akhir) { alert("Sila masukkan ID Akhir untuk Mod Pukal."); return; }
            let dataMula = ekstrakID(id_mula);
            let dataAkhir = ekstrakID(id_akhir);
            if (!dataMula || !dataAkhir || dataMula.prefix !== dataAkhir.prefix || dataMula.num > dataAkhir.num) {
                alert("Ralat Format Pukal: Pastikan ID Mula & Akhir mempunyai format yang sama."); return;
            }
            for (let i = dataMula.num; i <= dataAkhir.num; i++) {
                senaraiID.push(dataMula.prefix + String(i).padStart(dataMula.padLength, '0'));
            }
        } else {
            senaraiID.push(id_mula);
        }

        if (!sejarahID[lokaliti]) sejarahID[lokaliti] = [];
        let idTindih = senaraiID.filter(id => sejarahID[lokaliti].includes(id));
        if (idTindih.length > 0) {
            let teruskan = confirm("⚠️ Amaran: Terdapat ID yang telah direkodkan di lokaliti ini:\n" + idTindih.join(", ") + "\n\nTeruskan simpan?");
            if (!teruskan) return;
        }

        let jenis_premis = document.getElementById("jenis_premis").value;
        let jalan_blok_raw = "";
        
        if (jenis_premis === "STRATA") {
            let b = document.getElementById("strata_blok").value.toUpperCase();
            let t = document.getElementById("strata_tingkat").value.toUpperCase();
            if (b && t) jalan_blok_raw = "BLOK " + b + " TINGKAT " + t;
            else if (b) jalan_blok_raw = "BLOK " + b;
            else if (t) jalan_blok_raw = "TINGKAT " + t;
        } else if (jenis_premis === "LANDED") {
            let j = document.getElementById("landed_jalan").value.toUpperCase();
            if (j) jalan_blok_raw = j;
        }

        // FUNGSI BAHARU: Tambah koma atas (') untuk elak Google Sheets tukar jadi tarikh
        let jalan_blok = jalan_blok_raw ? "'" + jalan_blok_raw : "";

        let tindakan = tindakan_asal.toUpperCase();
        let status = document.getElementById("status").value.toUpperCase();
        let CATATAN = document.getElementById("catatan").value.toUpperCase(); 
        let tarikh = new Date().toLocaleDateString('en-GB');
        let masa = new Date().toLocaleTimeString('en-US', { hour12: false });
        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];
        
        let rekodAkhirID = "";

        senaraiID.forEach((id_semasa, index) => {
            if (tindakan_asal === "Pasang") {
                senaraiRekod.push({ lokaliti, jalan_blok, tarikh, masa, id_bekas: id_semasa, tindakan, status: "N/A", latitud: latSemasa, longitud: lngSemasa, CATATAN });
            } 
            else if (tindakan_asal === "Kutip") {
                senaraiRekod.push({ lokaliti, jalan_blok, tarikh, masa, id_bekas: id_semasa, tindakan, status, latitud: latSemasa, longitud: lngSemasa, CATATAN });
                if (ganti === "YA") {
                    let id_baharu_mula = document.getElementById("id_bekas_baharu").value.toUpperCase();
                    if (!id_baharu_mula) { alert("Sila masukkan ID Bekas Baharu."); return; }
                    let id_baharu_semasa = id_baharu_mula;
                    if (isPukal) {
                        let dataB = ekstrakID(id_baharu_mula);
                        if (!dataB) { alert("Format ID Baharu tidak sah."); return; }
                        let numKira = dataB.num + index; 
                        id_baharu_semasa = dataB.prefix + String(numKira).padStart(dataB.padLength, '0');
                    }
                    senaraiRekod.push({ lokaliti, jalan_blok, tarikh, masa, id_bekas: id_baharu_semasa, tindakan: "PASANG", status: "N/A", latitud: latSemasa, longitud: lngSemasa, CATATAN });
                    if (!sejarahID[lokaliti].includes(id_baharu_semasa)) sejarahID[lokaliti].push(id_baharu_semasa);
                }
            }
            if (!sejarahID[lokaliti].includes(id_semasa)) sejarahID[lokaliti].push(id_semasa);
            rekodAkhirID = id_semasa; 
        });

        localStorage.setItem("sejarahID_V2", JSON.stringify(sejarahID));
        localStorage.setItem("dataSO", JSON.stringify(senaraiRekod));
        alert("Berjaya disimpan! (" + senaraiID.length + " bekas diproses)");
        
        if(isPukal) { document.getElementById("label_last_id").innerText = "Rekod Terakhir (Pukal): " + senaraiID[0] + " - " + rekodAkhirID; } 
        else { document.getElementById("label_last_id").innerText = "Rekod Terakhir: " + rekodAkhirID; }
        
        document.getElementById("id_bekas").value = ""; 
        document.getElementById("id_bekas_akhir").value = ""; 
        document.getElementById("id_bekas_baharu").value = "";
        document.getElementById("catatan").value = ""; 
        document.getElementById("amaran_id_utama").style.display = "none";
        
        if(tindakan_asal === "Kutip") { urusTindakan(); }
        janaSenaraiID(); 
        kiraRekod();
    }

    function kiraRekod() {
        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];
        document.getElementById("rekod_count").innerText = senaraiRekod.length;
    }
    kiraRekod();

    function syncData() {
        let senaraiRekod = JSON.parse(localStorage.getItem("dataSO")) || [];
        if (senaraiRekod.length === 0) { alert("Tiada data baharu untuk di-sync."); return; }

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4x6ZtUiUyfI9yYAEFQwbgmPyFS5HCRFcH8xNMPlmF_MmKIo5KytBIZo-atUPIos2U/exec"; 
        document.querySelector(".sync").innerText = "Sedang Sync (Mohon Tunggu)...";

        fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(senaraiRekod), 
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                localStorage.setItem("dataSO", JSON.stringify([]));
                kiraRekod();
                document.querySelector(".sync").innerText = "Sync ke Server ☁️";
                alert("Semua data berjaya masuk ke Google Sheets mengikut urutan!");
            } else { throw new Error(data.message); }
        })
        .catch(error => {
            console.error('Error:', error);
            document.querySelector(".sync").innerText = "Sync ke Server ☁️";
            alert("Ralat! Pastikan internet anda stabil.");
        });
    }
</script>

</body>
</html>
